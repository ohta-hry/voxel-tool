<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Voxel Tool</title>
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/settings.css">
</head>
<body>

<div id="canvas-container">
  <button id="btn-settings-toggle" title="キャンバス設定">⚙</button>
  <div id="settings-drawer">

    <!-- 切り替え: 表示 / データ -->
    <div class="seg-toggle" id="settings-tabs">
      <button class="seg-btn active" data-pane="pane-display">表示</button>
      <button class="seg-btn" data-pane="pane-data">データ</button>
    </div>

    <!-- 表示: キャンバスサイズ + チェックボックス -->
    <div id="pane-display" class="drawer-pane active">
      <div class="drawer-title">キャンバスサイズ (XZ)</div>
      <div class="settings-row">
        <div class="settings-label x">X</div>
        <input class="setting-num" id="canvas-x" type="number" value="16" min="1" step="1">
        <div class="settings-label z">Z</div>
        <input class="setting-num" id="canvas-z" type="number" value="16" min="1" step="1">
      </div>
      <button id="btn-apply-settings">✓ 適用</button>
      <div class="check-row">
        <input type="checkbox" id="chk-edge-voxel">
        <label for="chk-edge-voxel">
          <span class="check-box" id="chk-edge-voxel-icon"></span>
          辺のボクセルを表示（直方体のみ機能）
        </label>
      </div>
    </div>

    <!-- データ: エクスポート/インポート + 新機能（仮UI） -->
    <div id="pane-data" class="drawer-pane">
      <div class="save-row">
        <button id="btn-export-save">📤 エクスポート</button>
        <button id="btn-import-save">📥 インポート</button>
      </div>

      <div class="drawer-sep"></div>

      <!-- ↓ 仮のUI（機能は未実装） -->
      <div class="seg-toggle three" id="data-mode-toggle">
        <button class="seg-btn active">a</button>
        <button class="seg-btn">b</button>
        <button class="seg-btn">c</button>
      </div>
      <div class="drawer-title">ファイル名</div>
      <input class="setting-text" id="data-filename" type="text" autocomplete="off" spellcheck="false">
      <button id="btn-data-action">▶ 実行（仮）</button>
    </div>

  </div>
</div>

<!-- Export Modal -->
<div id="modal-export" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">💾 セーブをエクスポート</div>
    <div class="modal-desc">これはあなたのセーブコードです。<br>コピーして安全な場所に保管してください！</div>
    <textarea id="export-textarea" class="modal-textarea" readonly></textarea>
    <div class="modal-btn-row">
      <button id="btn-export-copy" class="modal-btn ok">📋 コピー</button>
      <button id="btn-export-close" class="modal-btn cancel">✕ 閉じる</button>
    </div>
  </div>
</div>

<!-- Import Modal -->
<div id="modal-import" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">📂 セーブをインポート</div>
    <div class="modal-desc">エクスポートする時にコピーしたコードを貼り付けてください。</div>
    <textarea id="import-textarea" class="modal-textarea" placeholder="コードをここに貼り付け..."></textarea>
    <div class="modal-btn-row">
      <button id="btn-import-load" class="modal-btn ok">▶ ロード</button>
      <button id="btn-import-cancel" class="modal-btn cancel">やめておく</button>
    </div>
  </div>
</div>


<div id="panel">

  <!-- Edit dropdown (固定) -->
  <div id="edit-row">
    <span id="edit-label">編集</span>
    <select id="box-select">
      <option value="">── 選択 ──</option>
    </select>
  </div>

  <!-- Tab bar (∩型) -->
  <div id="tab-bar">
    <button class="tab-btn active" data-tab="tab-xyz">XYZ</button>
    <button class="tab-btn" data-tab="tab-color">カラー</button>
    <button class="tab-btn" data-tab="tab-type">タイプ</button>
  </div>

  <!-- Tab A: XYZ（スピナー＋ボタン3つ） -->
  <div id="tab-xyz" class="tab-content active">
    <div id="spin-panel">
      <div class="header-row">
        <div></div>
        <div class="col-header">基準点</div>
        <div class="col-header">サイズ</div>
      </div>
      <div class="grid-row" style="margin-top:6px">
        <div class="axis-label x">X</div>
        <div class="spin-wrap">
          <button class="spin-btn" data-target="ox" data-delta="-1">−</button>
          <input class="spin-input" id="ox" type="number" value="0" min="0" step="1">
          <button class="spin-btn" data-target="ox" data-delta="1">+</button>
        </div>
        <div class="spin-wrap">
          <button class="spin-btn" data-target="sx" data-delta="-1">−</button>
          <input class="spin-input" id="sx" type="number" value="1" min="1" step="1">
          <button class="spin-btn" data-target="sx" data-delta="1">+</button>
        </div>
      </div>
      <div class="grid-row" style="margin-top:6px">
        <div class="axis-label z">Z</div>
        <div class="spin-wrap">
          <button class="spin-btn" data-target="oz" data-delta="-1">−</button>
          <input class="spin-input" id="oz" type="number" value="0" min="0" step="1">
          <button class="spin-btn" data-target="oz" data-delta="1">+</button>
        </div>
        <div class="spin-wrap">
          <button class="spin-btn" data-target="sz" data-delta="-1">−</button>
          <input class="spin-input" id="sz" type="number" value="1" min="1" step="1">
          <button class="spin-btn" data-target="sz" data-delta="1">+</button>
        </div>
      </div>
      <div class="grid-row" style="margin-top:6px">
        <div class="axis-label y">Y</div>
        <div class="spin-wrap">
          <button class="spin-btn" data-target="oy" data-delta="-1">−</button>
          <input class="spin-input" id="oy" type="number" value="0" min="0" step="1">
          <button class="spin-btn" data-target="oy" data-delta="1">+</button>
        </div>
        <div class="spin-wrap">
          <button class="spin-btn" data-target="sy" data-delta="-1">−</button>
          <input class="spin-input" id="sy" type="number" value="1" min="1" step="1">
          <button class="spin-btn" data-target="sy" data-delta="1">+</button>
        </div>
      </div>
    </div>
    <!-- 屋根モード専用UI (roof選択時のみ表示) -->
    <div id="roof-axis-row" style="display:none; gap:6px; align-items:center;">
      <span style="font-size:9px;color:#555c70;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;flex-shrink:0;">勾配軸</span>
      <button id="btn-roof-x" class="action-btn" style="flex:1;padding:6px 4px;font-size:11px;background:#2a4a6e;border:1px solid #3a6a9e;color:#8ec8f8;">+X</button>
      <button id="btn-roof-z" class="action-btn" style="flex:1;padding:6px 4px;font-size:11px;background:#1b1f2a;border:1px solid #2a2f3d;color:#555c70;">+Z</button>
      <button id="btn-roof-gable" class="action-btn" style="flex:0 0 auto;padding:6px 7px;font-size:11px;background:#1b1f2a;border:1px solid #2a2f3d;color:#555c70;" title="両屋根（切妻）モード">両</button>
    </div>
    <div class="btn-row">
      <button id="btn-primary" class="action-btn">▶ 配置</button>
      <button id="btn-middle" class="action-btn">⌂ 原点</button>
      <button id="btn-secondary" class="action-btn">✕ クリア</button>
    </div>
  </div>

  <!-- Tab B: カラー（パレット＋カスタムピッカー＋適用） -->
  <div id="tab-color" class="tab-content">
    <div id="color-palette"></div>
    <div id="color-picker-row">
      <div id="color-picker-preview"></div>
      <button id="btn-open-color-picker">🎨 カスタム</button>
      <button id="btn-apply-color">✓ 適用</button>
    </div>
  </div>

  <!-- Tab C: タイプ -->
  <div id="tab-type" class="tab-content">
    <div id="type-grid"></div>
    <div class="btn-row" style="grid-template-columns:1fr;">
      <button id="btn-apply-type" class="action-btn" style="background:#2a4a6e;border:1px solid #3a6a9e;color:#8ec8f8;">✓ 適用</button>
    </div>
  </div>

</div>

<!-- Custom Color Picker Modal -->
<div id="modal-color-picker" class="modal-overlay">
  <div id="color-picker-modal-box">
    <div id="cp-title">カラーピッカー</div>
    <canvas id="cp-sv-canvas"></canvas>
    <canvas id="cp-hue-canvas"></canvas>
    <div id="cp-bottom-row">
      <div id="cp-preview-swatch"></div>
      <input id="cp-hex-input" type="text" maxlength="7" placeholder="#RRGGBB">
    </div>
    <div id="cp-btn-row">
      <button id="cp-btn-ok">✓ 決定</button>
      <button id="cp-btn-cancel">✕ キャンセル</button>
    </div>
  </div>
</div>


<script type="importmap">
{ "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
